[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "emg-research"
version = "0.1.0"
description = "Local synchronized EMG acquisition, temporal decoding, and residual-control experiments"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.34,<1", "numpy>=2,<3", "scipy>=1.14,<2"]

[project.optional-dependencies]
train = ["torch>=2.6,<3", "scikit-learn>=1.6,<2"]
rl = ["gymnasium>=1.1,<2", "stable-baselines3>=2.6,<3"]
dev = ["pytest>=8,<10", "httpx>=0.28,<1"]

[project.scripts]
emg-lab = "emg_research.server:main"
emg-dataset = "emg_research.dataset:main"
emg-train = "emg_research.train:main"
emg-demo = "emg_research.synthetic:main"
emg-rl = "emg_research.rl:main"
emg-storage = "emg_research.storage:main"
emg-import-placement = "emg_research.placement:main"

[tool.setuptools.packages.find]
include = ["emg_research*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
